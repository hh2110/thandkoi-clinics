# Render blueprint (https://render.com/docs/blueprint-spec).
#
# One production environment, one web service — no staging, no per-feature
# preview services (see .claude/plans/02-development-lifecycle.md → "No staging
# environment"). Deploys are triggered manually via the Deploy workflow
# (.github/workflows/deploy.yml), never automatically on push.
#
# The database is **Neon Postgres** (a single, external, managed database), not
# a Render-managed one — Plan 02's Database decision. Its connection string is
# supplied to the service as the DATABASE_URL secret (set in the Render
# dashboard from the Neon connection string; never committed).
#
# The web service:
#   * installs dependencies with uv from the committed uv.lock,
#   * collects static files (served by WhiteNoise),
#   * runs migrations as a pre-deploy step,
#   * serves the app with gunicorn.
#
# !! THIS FILE IS NOT REACHING THE LIVE SERVICE (observed 2026-07-26) !!
#
# What was actually measured, and nothing more: on 2026-07-26 the live service
# (srv-d9ej48n41pts73f1i3p0) differed from this file in the two fields listed
# below, and a deploy that same day did not reconcile them. So editing this
# file cannot be assumed to change production — mirror every change by hand in
# the Render dashboard.
#
# Why it diverges was NOT established. The service may never have been linked
# to this blueprint, or a linked blueprint may not be syncing, or a dashboard
# edit may be overriding it. If you intend to fix the mechanism rather than the
# two values, find out which of those is true first — don't infer it from here.
#
# That the divergence is real is not in doubt. Both fields were caught only
# while diagnosing the 2026-07-26 outage:
#   * startCommand was missing --timeout 120, so gunicorn ran on its 30s
#     default — meaning the Plan 15 Track B3 protection documented below had
#     never actually been in effect.
#   * healthCheckPath was empty, so Render had no health signal and never
#     restarted a wedged instance on its own.
#
# So: treat the live service as the source of truth for what production *is*
# (read it with the Render MCP's get_service, or the dashboard), and this file
# as the source of truth for what it *should be*. When they disagree, one of
# them is a bug — do not assume it is this file.

services:
  - type: web
    name: thandkoi-clinics
    runtime: python
    # Singapore, to sit next to the database: Neon runs in aws-ap-southeast-1
    # (Plan 02's Database decision), and every request makes at least one round
    # trip to it. Omitting this field does NOT inherit the live service's
    # region — the blueprint default is `oregon`, which would put the app a
    # continent away from its own database. Render cannot move a service
    # between regions after creation, so this line documents an immutable fact
    # about the running service rather than something a sync can change; it is
    # here so a rebuild from this file lands in the right place.
    # (Added 2026-07-26 — the file had never declared it.)
    region: singapore
    # Deploys are manual, full stop: production only ever changes when a human
    # runs the Deploy workflow against a release tag (Plan 02's Promotion
    # decision, .github/workflows/deploy.yml). The header comment has always
    # claimed this, but the file never encoded it. An existing service retains
    # its current setting when a blueprint omits this, so production was never
    # at risk — but a service rebuilt from this file would have defaulted to
    # `commit` and deployed on every push to main, silently removing the one
    # gate the whole release process rests on.
    #
    # `off` is the current spelling; it replaces the deprecated
    # `autoDeploy: false`. Quoted deliberately: this field is a string enum
    # (commit / checksPass / off), but YAML 1.1 coerces a bare off/on/yes/no
    # to a boolean, so an unquoted `off` risks arriving as `false` instead of
    # the string the spec asks for. (Added 2026-07-26.)
    autoDeployTrigger: "off"
    # Starter compute ($7/mo): no cold starts, public-facing. See Plan 02's
    # "Production host" decision (the account-level workspace plan is separate
    # from this per-service compute tier — Hobby workspace + Starter compute).
    plan: starter
    # Install uv, sync the locked environment, then collect static assets.
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev &&
      uv run python manage.py collectstatic --no-input
    # Apply migrations before the new version starts taking traffic.
    preDeployCommand: uv run python manage.py migrate --no-input
    # --timeout 120 (Plan 15 Track B3): the daily-report publish runs its AI
    # calls inside the synchronous upload request, so a hung call would
    # otherwise pin a worker on the default 30s timeout mid-ingest. 120s must
    # exceed the worst-case sum of a request's in-flight AI calls (each bounded
    # to 30s + 2 retries by the Anthropic client — see
    # apps.pipeline.ai.get_anthropic_client); this is the outer backstop that
    # kills a worker no single-call timeout caught.
    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Neon Postgres connection string — set as a secret in the Render
      # dashboard (Environment tab). Not generated by Render, not committed.
      - key: DATABASE_URL
        sync: false
      # Seconds libpq may spend opening a connection (PR #150, config/database.py)
      # — optional and not a secret. Blank means the code default (5s). This is
      # the dial to reach for if Neon cold starts ever begin failing after an
      # idle period: raise it here with no deploy, exactly like
      # SENTRY_TRACES_SAMPLE_RATE. It exists because libpq's own default is 0,
      # "wait forever", which turned the 2026-07-26 network fault into a
      # 30-minute outage instead of a fast 503.
      - key: DB_CONNECT_TIMEOUT
        sync: false
      # Anthropic API key for production AI drafting — set as a secret in the
      # Render dashboard. The test suite never uses this (AI is always mocked).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Object storage for user-uploaded media (Wagtail images/documents).
      # Cloudflare R2 (S3-compatible) — WhiteNoise serves static only and
      # Render's disk is ephemeral, so media must live in a bucket. All set as
      # secrets in the Render dashboard; the endpoint embeds the R2 account id
      # and the keys are credentials, so none are committed. See
      # docs/deploying.md → Secrets and .claude/plans/10-media-object-storage.md.
      - key: MEDIA_BUCKET_NAME
        sync: false
      - key: MEDIA_S3_ENDPOINT_URL
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_CUSTOM_DOMAIN
        sync: false
      # Sentry error tracking (Plan 12 Track A) — optional. Unlike the secrets
      # above, the app boots and runs identically if this is left unset; it
      # only enables error reporting once set. See docs/deploying.md → Secrets.
      - key: SENTRY_DSN
        sync: false
      # Sentry trace sample rate (Plan 17 Track A) — optional and not a secret.
      # Blank means the code default (1.0), which the free plan's 5M-span
      # budget absorbs many times over at this site's traffic. Set to 0 here to
      # switch performance tracing off with no deploy and no code change; an
      # unparseable value is ignored in favour of the default rather than
      # failing boot. See docs/deploying.md → Secrets.
      - key: SENTRY_TRACES_SAMPLE_RATE
        sync: false
      # Umami Cloud website ID (Plan 12 Track B) — not a secret, just optional:
      # blank until the maintainer registers a site, and base.html renders no
      # analytics script at all until it's set. See docs/deploying.md.
      - key: UMAMI_WEBSITE_ID
        sync: false
      # Generated once by Render and kept secret.
      - key: SECRET_KEY
        generateValue: true
      # The service's own external hostname, so ALLOWED_HOSTS stays locked down.
      # Add any custom domain (thandkoiclinics.com) here once DNS is configured.
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: thandkoi-clinics
          property: host
